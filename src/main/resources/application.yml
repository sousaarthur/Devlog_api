spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/postgres
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate.default_schema: blog_db
  flyway:
    enabled: true
    schemas: blog_db
    table: flyway_schema_history

api:
  security:
    token:
      secret: ${JWT_SECRET:my-secret-key}
